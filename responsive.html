<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レスポンシブレイアウト</title>

    <style>
      /* デフォルト（スマホ優先：縦並び） */
      .flex-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .flex-item {
        background-color: #2196f3;
        color: white;
        padding: 15px;
        text-align: center;
      }

      /* PCサイズ（768px以上：横並び） */
      @media (min-width: 768px) {
        .flex-container {
          flex-direction: row;
        }
      }
    </style>
  </head>
  <body>
    <div class="flex-container">
      <div class="flex-item">カラム 1</div>
      <div class="flex-item">カラム 2</div>
    </div>
  </body>
</html>
